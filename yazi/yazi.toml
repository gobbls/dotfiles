[opener]
play = [
    { run = "mpv %s", orphan = true, for = "unix" }
]

show = [
    { run = "swayimg %s", orphan = true, for = "unix" },
]

edit = [
    { run = "$EDITOR %s", block = true, for = "unix" }
]

set-wallpaper = [
    { run = "wpppicker --image %s", orphan = true, for = "unix" }
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { mime = "video/*", use = "play" },
    { mime = "image/*", use = [ "show", "set-wallpaper" ] }
]
